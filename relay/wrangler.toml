# Relais du contrôle à distance MyTV.
# Mise en ligne : npx wrangler login (une fois), puis npm run deploy.
name = "edge"
main = "src/index.js"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# Durable Object « SQLite » : disponible sur l'offre gratuite de Cloudflare.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true
